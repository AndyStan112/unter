apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: unter
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/AndyStan112/unter.git
  ref:
    branch: deployments
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unter
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: unter
  path: ./deploy/app
  prune: true
  deletionPolicy: Orphan
  wait: true
