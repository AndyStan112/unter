apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: &id001
      app: rabbitmq
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: unter
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rabbitmq
        image: rabbitmq:4.1.4-alpine
        ports:
        - containerPort: 5672
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: unter
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_NODENAME
          value: rabbit@rabbitmq-0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        readinessProbe:
          exec: &id002
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          periodSeconds: 10
          timeoutSeconds: 10
        startupProbe:
          exec: *id002
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 60
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
