apiVersion: v1
kind: Service
metadata:
  name: core
spec:
  selector:
    app: core
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: core
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: unter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: core
        image: unter-core
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_USERNAME
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: SERVICE_USERNAME
        - name: SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: SERVICE_PASSWORD
        - name: DB_HOST
          value: postgres
        - name: DB_NAME
          value: core
        - name: DB_USER
          value: core
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: CORE_DB_PASSWORD
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: RABBITMQ_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
