apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: &id001
      app: postgres
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: unter
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17.6-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: unter
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: POSTGRES_PASSWORD
        - name: CORE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: CORE_DB_PASSWORD
        - name: AGENT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: AGENT_DB_PASSWORD
        - name: ACTIVITY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unter-secrets
              key: ACTIVITY_DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          exec: &id002
            command:
            - pg_isready
            - -U
            - unter
            - -d
            - postgres
          periodSeconds: 10
          timeoutSeconds: 10
        startupProbe:
          exec: *id002
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 60
      volumes:
      - name: init
        configMap:
          name: db-init
          defaultMode: 493
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi
