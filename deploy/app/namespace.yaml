apiVersion: v1
kind: Namespace
metadata:
  name: unter
  labels:
    app.kubernetes.io/part-of: unter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unter
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: unter-budget
spec:
  hard:
    requests.cpu: '3'
    requests.memory: 4Gi
    limits.cpu: '8'
    limits.memory: 6Gi
    requests.storage: 8Gi
    persistentvolumeclaims: '4'
    pods: '16'
