# Optional source reload: docker compose -f compose.yaml -f compose.dev.yaml up --build
x-reload: &reload
  command: [sh, -c, 'exec uvicorn unter.$${SERVICE_MODULE}:app --host 0.0.0.0 --port 8000 --reload --no-access-log']
  volumes:
    - ./services/python/unter:/app/unter:ro,z
    - ./web:/app/web:ro,z
services:
  agent: *reload
  worker: *reload
  mcp: *reload
  gateway: *reload
  # Mailpit catches every report email locally: open http://localhost:8025. Nothing leaves the machine.
  mailer:
    <<: *reload
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURITY: none
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      MAIL_FROM: Unter reports <reports@unter.local>
    depends_on:
      mailpit: {condition: service_started}
  mailpit:
    image: axllent/mailpit:v1.20.0
    restart: unless-stopped
    ports: ['127.0.0.1:8025:8025']
