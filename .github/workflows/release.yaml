name: release
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unter-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.10.12', python-version: '3.12'}
      - run: uv sync --project services/python --frozen
      - run: uv run --project services/python pytest services/python/tests -q
      - run: node --check web/app.js && node --check web/sw.js
      - run: node --test .github/scripts/*.test.cjs
      - run: uv run --project services/python python scripts/scan-secrets.py
      - run: uv run --project services/python python scripts/init-env.py
      - name: Full stack integration (no paid model calls)
        run: |
          AGENT_MODE=fake docker compose up -d --build
          uv run --project services/python python scripts/check-migrations.py
          uv run --project services/python python scripts/integration.py
          uv run --project services/python python scripts/readonly-check.py
          uv run --project services/python python scripts/stats-check.py
          uv run --project services/python python scripts/schedule-check.py
      - if: failure()
        run: docker compose ps
      - if: always()
        run: docker compose down -v
  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [core, python]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/andystan112/unter-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AndyStan112/unter
            org.opencontainers.image.revision=${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/github-script@v7
        with:
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-deployment.cjs`);
            await publish({github, context, core});
