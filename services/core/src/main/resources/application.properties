spring.application.name=unter-core
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/core
spring.datasource.username=core
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.username=unter
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=simple
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.task.scheduling.pool.size=2
# Matching. Each can be overridden by an environment variable, e.g. UNTER_OFFERTIMEOUTSECONDS=20.
unter.offer-timeout-seconds=30
unter.match-timeout-seconds=120
unter.position-max-age-seconds=120
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=WARN
